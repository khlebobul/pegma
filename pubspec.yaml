name: pegma
description: "A free and cross-platform version of the classic Peg solitaire! Enjoy the timeless puzzle on your mobile device!"
publish_to: 'none'
version: 1.11.7+43

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  go_router: ^18.1.4
  flutter_svg: ^2.5.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  url_launcher_ios: ^6.4.2
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  talker: ^5.2.0
  talker_riverpod_logger: ^5.2.0
  talker_flutter: ^5.2.0
  intl_utils: ^2.8.17
  gaimon: ^1.5.1
  sqflite: ^2.4.6
  path: ^1.9.1
  rate_my_app: ^2.4.2
  upgrader: ^14.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.6
  motor: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path_ios: "assets/logo/logo-light.png"
  image_path_ios_dark_transparent: "assets/logo/logo-dark.png"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/logo/logo-light.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_foreground: "assets/logo/logo-light.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - lib/data/levels/

  fonts:
  - family: Pegma
    fonts:
      - asset: assets/fonts/pegma-app.ttf

flutter_intl:
  enabled: true
