name: pegma
description: "A free and cross-platform version of the classic Peg solitaire! Enjoy the timeless puzzle on your mobile device!"
publish_to: 'none'
version: 1.11.1+36

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.0.0
  flutter_svg: ^2.2.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  url_launcher_ios: ^6.3.6
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  talker: ^5.1.0
  talker_riverpod_logger: ^5.1.0
  talker_flutter: ^5.1.0
  intl_utils: ^2.8.11
  gaimon: ^1.4.1
  sqflite: ^2.4.2
  path: ^1.9.1
  in_app_review: ^2.0.11
  upgrader: ^12.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.15
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3

flutter_launcher_icons:
  android: "launcher_icon"
  image_path_ios: "assets/logo/logo-light.png"
  image_path_ios_dark_transparent: "assets/logo/logo-dark.png"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/logo/logo-light.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_foreground: "assets/logo/logo-light.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - lib/data/levels/

  fonts:
  - family: Pegma
    fonts:
      - asset: assets/fonts/pegma-app.ttf

flutter_intl:
  enabled: true
